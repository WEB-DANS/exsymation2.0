name: CI/CD Pipeline

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: server
        run: npm install

      - name: Build Docker image
        run: docker build -t exsymation-server .

      - name: Run Docker container
        run: docker run -d -p 3000:3000 --name exsymation-container exsymation-server

      - name: Test deployed application
        run: curl http://localhost:3000

      - name: Stop Docker container
        run: docker stop exsymation-container